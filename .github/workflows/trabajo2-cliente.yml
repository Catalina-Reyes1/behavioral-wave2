# Trabajo de Aplicación II: descarga ^IRX y VOO, recalcula la hoja "Para el cliente" y la publica.
# No vuelve a correr el estudio de la Evaluación 1: solo escribe app/data/cliente.js y data/trabajo2/irx_voo.csv.
# Se corre a mano desde la pestaña "Actions" -> este workflow -> "Run workflow".
name: Trabajo II - hoja para el cliente

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cliente:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar ^IRX y VOO y recalcular la hoja
        run: python -m src.oos_cliente --descargar

      - name: Subir los datos de la hoja
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/cliente.js data/trabajo2/irx_voo.csv
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Trabajo II: datos de la hoja Para el cliente con ^IRX y VOO"
            git push
          fi

      - name: Publicar el sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
